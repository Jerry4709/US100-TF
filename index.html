<div id="bar">

<script>
// ---------- ICT Sessions & Killzones, in New York time so US daylight saving is handled (NY open 09:30 = 20:30 Bangkok in summer, 21:30 in winter) ----------
const KZ = [
  { name: 'Asia',     from: '20:00', to: '03:00', color: '#ff9800', box: true },
  { name: 'Asia KZ',  from: '20:00', to: '00:00', color: '#ff9800' },
  { name: 'London',   from: '04:00', to: '09:30', color: '#00e676', box: true },
  { name: 'LOKZ',     from: '03:00', to: '06:00', color: '#00e676' },
  { name: 'LOCKZ',    from: '11:00', to: '13:00', color: '#00e676' },
  { name: 'New York', from: '09:30', to: '17:00', color: '#aa00ff', box: true },
  { name: 'NYKZ',     from: '08:00', to: '11:00', color: '#aa00ff' },
  { name: 'SYSNY',    from: '17:00', to: '21:00', color: '#00bcd4', box: true },
];
const nyFmt = new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', hourCycle: 'h23', hour: '2-digit', minute: '2-digit' });
const nyOff = new Map();   // UTC hour -> New York offset in minutes (cached, Intl is slow)
function nyMinutes(ts) {   // minutes since New York midnight
  const h = Math.floor(ts / 36e5);
  if (!nyOff.has(h)) { const [hh, mm] = nyFmt.format(h * 36e5).split(':').map(Number); nyOff.set(h, hh * 60 + mm - (h % 24) * 60); }
  return ((Math.floor(ts / 6e4) % 1440 + nyOff.get(h)) % 1440 + 1440) % 1440;
}
const KZ_MAX_TF_MIN = 45;   // hide killzones above this timeframe
const toMin = s => +s.slice(0, 2) * 60 + +s.slice(3);
KZ.forEach(z => { z.f = toMin(z.from); z.t = toMin(z.to); });
const inZone = (m, z) => z.f < z.t ? m >= z.f && m < z.t : m >= z.f || m < z.t;   // handles sessions crossing midnight

function kzCalc(list) {
  const res = list.map(() => ({}));
  res.zones = [];
  let tf = Infinity;
  for (let i = 1; i < Math.min(list.length, 50); i++) tf = Math.min(tf, list[i].timestamp - list[i - 1].timestamp);
  if (tf > KZ_MAX_TF_MIN * 6e4) return res;
  const open = {};
  list.forEach((k, i) => {
    const m = nyMinutes(k.timestamp);
    for (const z of KZ) {
      let c = open[z.name];
      if (!inZone(m, z)) { open[z.name] = null; continue; }
      if (!c || k.timestamp - c.lastTs > 6 * 36e5) {
        c = open[z.name] = { z, start: i, end: i, high: k.high, low: k.low, lastTs: k.timestamp };
        res.zones.push(c);
      } else { c.end = i; c.high = Math.max(c.high, k.high); c.low = Math.min(c.low, k.low); c.lastTs = k.timestamp; }
    }
  });
  // killzone high/low extend right until price trades through them (liquidity taken)
  for (const c of res.zones) {
    if (c.z.box) continue;
    c.hiEnd = c.loEnd = list.length - 1; c.hiHit = c.loHit = false;
    for (let j = c.end + 1; j < list.length && !(c.hiHit && c.loHit); j++) {
      if (!c.hiHit && list[j].high > c.high) { c.hiEnd = j; c.hiHit = true; }
      if (!c.loHit && list[j].low < c.low) { c.loEnd = j; c.loHit = true; }
    }
  }
  return res;
}

function kzDraw({ ctx, indicator, visibleRange, barSpace, xAxis, yAxis }) {
  const zones = indicator.result.zones || [], half = barSpace.bar / 2, fmt = v => v.toLocaleString('en-US', { maximumFractionDigits: 2 });
  const X = i => xAxis.convertToPixel(i), Y = v => yAxis.convertToPixel(v);
  ctx.font = '11px system-ui, sans-serif';
  for (const c of zones) {
    const last = c.z.box ? c.end : Math.max(c.hiEnd, c.loEnd);
    if (last < visibleRange.from - 1 || c.start > visibleRange.to + 1) continue;
    const x1 = X(c.start) - half, x2 = X(c.end) + half, yH = Y(c.high), yL = Y(c.low);
    ctx.strokeStyle = ctx.fillStyle = c.z.color;
    if (c.z.box) {
      ctx.globalAlpha = 0.18; ctx.fillRect(x1, yH, x2 - x1, yL - yH);
      ctx.globalAlpha = 1; ctx.fillText(c.z.name, x1, yH - 5);
      continue;
    }
    ctx.globalAlpha = 0.9; ctx.lineWidth = 1;
    for (const [y, end, hit, tag, v] of [[yH, c.hiEnd, c.hiHit, 'H', c.high], [yL, c.loEnd, c.loHit, 'L', c.low]]) {
      ctx.setLineDash([]); ctx.beginPath(); ctx.moveTo(x1, y); ctx.lineTo(x2, y); ctx.stroke();
      const xe = X(end);
      ctx.setLineDash([4, 3]); ctx.beginPath(); ctx.moveTo(x2, y); ctx.lineTo(xe, y); ctx.stroke();
      if (!hit) ctx.fillText(`${c.z.name} ${tag} ${fmt(v)}`, xe + 4, y + (tag === 'H' ? -3 : 11));   // label only untaken liquidity
    }
  }
  ctx.setLineDash([]); ctx.globalAlpha = 1;
  return true;
}
// ---------- Buy/Sell plan (like TradingView Long/Short Position): click Entry -> Stop Loss -> Take Profit. Drawing only, no orders. ----------
klinecharts.registerOverlay({
  name: 'tradePlan', totalStep: 4, needDefaultPointFigure: true, needDefaultXAxisFigure: true, needDefaultYAxisFigure: true,
  createPointFigures: ({ coordinates: c, overlay, precision }) => {
    if (c.length < 2) return [];
    const v = overlay.points.map(p => p.value), [e, s, t] = c, dp = precision.price;
    const x = e.x, w = Math.max(120, ...c.map(p => p.x - x)), f = n => n.toLocaleString('en-US', { minimumFractionDigits: dp, maximumFractionDigits: dp });
    const buy = t ? v[2] > v[0] : v[1] < v[0], risk = Math.abs(v[0] - v[1]), pct = d => (d / v[0] * 100).toFixed(2);
    const zone = (y, color) => ({ type: 'rect', attrs: { x, y: Math.min(e.y, y), width: w, height: Math.abs(y - e.y) }, styles: { style: 'fill', color } });
    const label = (y, text, bg, base) => ({ type: 'text', attrs: { x: x + 4, y, text, baseline: base }, styles: { color: '#fff', size: 12, backgroundColor: bg, paddingLeft: 4, paddingRight: 4, paddingTop: 2, paddingBottom: 2, borderRadius: 2 } });
    const figs = [zone(s.y, 'rgba(242,54,69,0.22)'), { type: 'line', attrs: { coordinates: [{ x, y: e.y }, { x: x + w, y: e.y }] }, styles: { color: '#d1d4dc' } }];
    figs.push(label(s.y, `SL ${f(v[1])}  -${f(risk)} (${pct(risk)}%)`, '#f23645', s.y > e.y ? 'top' : 'bottom'));
    let head = `${buy ? 'BUY' : 'SELL'} ${f(v[0])}`;
    if (t) {
      const reward = Math.abs(v[2] - v[0]), wrongSide = (v[1] < v[0]) !== buy;
      figs.push(zone(t.y, 'rgba(8,153,129,0.22)'), label(t.y, `TP ${f(v[2])}  +${f(reward)} (${pct(reward)}%)`, '#089981', t.y < e.y ? 'bottom' : 'top'));
      head += wrongSide ? '  ⚠ SL อยู่ฝั่งเดียวกับ TP' : `  R:R 1:${(reward / risk).toFixed(2)}`;
    }
    figs.push(label(e.y, head, buy ? '#2962ff' : '#e65100', 'middle'));
    return figs;
  },
});

klinecharts.registerIndicator({ name: 'ICT_KZ', shortName: 'ICT KZ', series: 'price', zLevel: -1, figures: [], calc: kzCalc, draw: kzDraw });

// ---------- chart panes ----------
const UNIT = { second: 1e3, minute: 6e4, hour: 36e5, day: 864e5 };
const AXIS_FMT = { second: 'HH:mm:ss', minute: 'HH:mm', hour: 'MM-DD HH:mm', day: 'YYYY-MM-DD' };
const periodMs = p => p.multiplier * UNIT[p.timespan];
const PERIODS = [[5, 'second', '5s'], [10, 'second', '10s'], [15, 'second', '15s'], [30, 'second', '30s'],
  [1, 'minute', '1m'], [3, 'minute', '3m'], [5, 'minute', '5m'], [15, 'minute', '15m'], [30, 'minute', '30m'],
  [1, 'hour', '1H'], [4, 'hour', '4H'], [1, 'day', 'D']].map(([multiplier, timespan, text]) => ({ multiplier, timespan, text }));

const panes = [];    // { el, pro, kc, sym, sub, ids }
const recent = {};   // symbol -> last few minutes of live ticks [[utcMs, price], ...]
let digits = {}, offset = 0, drawings = {}, kzOn = true, active = null;

// Data source: served by server.py (port 8765) -> MT5 on this PC. Anywhere else (GitHub Pages, file) -> public Bitget index prices.
const MT5 = location.port === '8765';
const ws = MT5 ? new WebSocket(`ws://${location.host}`) : null;
const waiting = {};
let reqId = 0;
const ask = q => new Promise(res => { waiting[++reqId] = res; ws.send(JSON.stringify({ ...q, id: reqId })); });

// ---------- public feeds (no key, CORS open) ----------
// US100, XAUUSD: OKX index prices, with 1-second candles (~3 weeks back).
// US30: Bitget index of the DIA ETF x100 (no free Dow source has second history, so its second TFs start at page open).
const OKX = 'https://www.okx.com/api/v5/market/';
const BG = 'https://api.bitget.com/api/v2/mix/market/';
const OKX_IDS = { US100: 'US100-USDT', XAUUSD: 'XAU-USD' };
const PUB = { US30: ['DIASTOCKUSDT', 100] };   // Bitget id, scale
const OKX_TF = { 1e3: '1s', 6e4: '1m', 18e4: '3m', 3e5: '5m', 9e5: '15m', 18e5: '30m', 36e5: '1H', 144e5: '4H', 864e5: '1Dutc' };
const BG_TF = { 6e4: '1m', 18e4: '3m', 3e5: '5m', 9e5: '15m', 18e5: '30m', 36e5: '1H', 144e5: '4H', 864e5: '1Dutc' };
const getJSON = async url => (await fetch(url)).json();
const sleep = ms => new Promise(r => setTimeout(r, ms));

// OKX rate limits are per endpoint (~20 calls / 2s each). The "recent" endpoint covers the newest ~1400 candles,
// "history" everything older, so using both doubles throughput.
const okxCalls = { 'index-candles': [], 'history-index-candles': [] };
async function okxGet(path, query) {
  for (;;) {
    const now = Date.now(), q = okxCalls[path] = okxCalls[path].filter(t => now - t < 2100);
    if (q.length < 18) break;
    await sleep(2100 - (now - q[0]));
  }
  okxCalls[path].push(Date.now());
  return getJSON(`${OKX}${path}?${query}`);
}

async function okxRows(id, step, end, need) {   // `need` candles of `step` ms ending before `end`, as Map ts -> row
  const recentFrom = Date.now() - 1400 * step;
  const got = await Promise.all(Array.from({ length: Math.ceil(need / 100) }, (_, i) => {
    const after = end - i * 100 * step;
    return okxGet(after - 100 * step > recentFrom ? 'index-candles' : 'history-index-candles', `instId=${id}&bar=${OKX_TF[step]}&after=${after}&limit=100`);
  }));
  const rows = new Map();
  for (const d of got) for (const r of d.data || []) rows.set(+r[0], r);   // newest-first, pages may overlap across gaps
  return rows;
}

function rowsToBars(rows, ms) {
  const bars = [];
  for (const [t, r] of [...rows].sort((a, b) => a[0] - b[0])) {
    const ts = t - t % ms, b = bars.at(-1), [o, h, l, c] = r.slice(1, 5).map(Number);
    if (b && b[0] === ts) { b[2] = Math.max(b[2], h); b[3] = Math.min(b[3], l); b[4] = c; }
    else bars.push([ts, o, h, l, c, 0]);
  }
  return bars;
}

// Initial history is fetched once per symbol+TF and reused; second TFs all share one set of 1s candles, so switching is instant.
// ponytail: cached bars + live ticks (kept 6h) bridge the gap; a TF left unopened for >6h would show a hole until reload
const okxInit = {};
const loadInit = (id, step) => okxInit[id + step] ??= (async () => {
  const mark = Date.now();
  return { rows: await okxRows(id, step, mark + step, step === 1e3 ? 3000 : 1000), mark };
})();

async function okxHistory(id, ms, to) {   // bars ending before `to` (or now)
  const step = ms < 6e4 ? 1e3 : ms, c = await loadInit(id, step);
  if (!to) return { bars: rowsToBars(c.rows, ms), mark: c.mark };   // live ticks after `mark` fill the rest
  const older = await okxRows(id, step, to, 1000);
  older.forEach((r, t) => c.rows.set(t, r));
  return { bars: rowsToBars(older, ms), mark: c.mark };
}

function stream(url, subscribe, parse) {   // public websocket with keep-alive ping and auto-reconnect
  const sock = new WebSocket(url), ping = setInterval(() => sock.readyState === 1 && sock.send('ping'), 25e3);
  sock.onopen = () => sock.send(JSON.stringify(subscribe));
  sock.onmessage = e => { if (e.data !== 'pong') parse(JSON.parse(e.data)); };
  sock.onclose = () => { clearInterval(ping); setTimeout(() => stream(url, subscribe, parse), 2000); };
}

function ticksToBars(list, ms) {   // build bars from recorded ticks with the same logic as live updates
  const out = [], sub = { ms, bar: null, cb: b => out.at(-1)?.timestamp === b.timestamp ? (out[out.length - 1] = b) : out.push(b) };
  for (const [t, p] of list) feed(sub, t, p);
  return out.map(b => [b.timestamp, b.open, b.high, b.low, b.close, b.volume]);
}

async function pubHistory(sym, ms, to, n) {
  if (OKX_IDS[sym]) {   // after this symbol's first load, prefetch its 1s candles so drilling down to second TFs is instant
    const r = okxHistory(OKX_IDS[sym], ms, to);
    r.then(() => loadInit(OKX_IDS[sym], 1e3));
    return r;
  }
  const [id, k] = PUB[sym], g = BG_TF[ms], mark = Date.now();
  // ponytail: no public tick history, so second TFs start from when the page was opened; a small recorder backend would fix it
  if (!g) return { bars: to ? [] : ticksToBars(recent[sym] || [], ms), mark: recent[sym]?.at(-1)?.[0] ?? 0 };
  const q = `symbol=${id}&productType=USDT-FUTURES&granularity=${g}`;
  let rows = [];
  if (!to) rows = (await getJSON(`${BG}candles?${q}&kLineType=index&limit=1000`)).data || [];   // includes the forming bar
  else for (let end = to; rows.length < n; ) {   // older bars, 200 per call, endTime is exclusive
    const d = (await getJSON(`${BG}history-index-candles?${q}&endTime=${end}&limit=200`)).data || [];
    if (!d.length) break;
    rows = d.concat(rows);
    end = +d[0][0];
  }
  return { bars: rows.map(r => [+r[0], r[1] * k, r[2] * k, r[3] * k, r[4] * k, 0]), mark };
}


// Pro hides its klinecharts instance; grab it at init to add seconds labels, drawing persistence and our indicator.
const kInit = klinecharts.init;
klinecharts.init = (dom, opts) => {
  const pane = panes.find(p => p.el.contains(dom));
  const kc = kInit(dom, { ...opts, customApi: {
    formatDate: (dtf, ts, _fmt, type) => klinecharts.utils.formatDate(dtf, ts,
      type === klinecharts.FormatDateType.XAxis ? AXIS_FMT[pane.pro?.getPeriod().timespan] ?? 'HH:mm' : 'YYYY-MM-DD HH:mm:ss')
  }});
  pane.kc = kc;
  hookDrawings(pane);
  if (kzOn) setTimeout(() => kc.createIndicator('ICT_KZ', true, { id: 'candle_pane' }));
  return kc;
};

// ---------- drawings: saved to the server (drawings.json) per symbol ----------
function hookDrawings(pane) {
  const { kc } = pane, create = kc.createOverlay.bind(kc), override = kc.overrideOverlay.bind(kc);
  let timer;
  const save = () => { if (!pane.loading) { clearTimeout(timer); timer = setTimeout(() => saveDrawings(pane), 300); } };
  const after = (fn, extra) => e => { const r = fn?.(e); extra?.(e); save(); return r; };
  kc.createOverlay = (value, paneId) => {
    const list = [].concat(value).map(o => typeof o === 'string' ? { name: o } : o).map(o => ({ ...o,
      onDrawEnd: after(o.onDrawEnd), onPressedMoveEnd: after(o.onPressedMoveEnd),
      onRemoved: after(o.onRemoved, e => pane.ids.delete(e.overlay.id)) }));
    const ids = create(list, paneId);
    ids.forEach(id => id && pane.ids.add(id));
    return Array.isArray(value) ? ids : ids[0];
  };
  kc.overrideOverlay = o => { override(o); save(); };
}

function saveDrawings(pane) {
  const list = [...pane.ids].map(id => pane.kc.getOverlayById(id)).filter(o => o && !o.isDrawing())
    .map(({ name, groupId, lock, visible, mode, styles, extendData, points }) =>
      ({ name, groupId, lock, visible, mode, styles, extendData, points: points.map(({ timestamp, value }) => ({ timestamp, value })) }));
  drawings[pane.sym] = list;
  if (MT5) ws.send(JSON.stringify({ op: 'save', s: pane.sym, overlays: list }));
  else try { localStorage.setItem('drawings', JSON.stringify(drawings)); } catch {}   // online: each visitor keeps their own drawings
  panes.filter(p => p !== pane && p.sym === pane.sym && p.kc).forEach(loadDrawings);   // same symbol open in the other pane
}

function loadDrawings(pane) {
  pane.loading = true;
  [...pane.ids].forEach(id => pane.kc.removeOverlay(id));
  pane.ids.clear();
  for (const o of drawings[pane.sym] || []) pane.kc.createOverlay(structuredClone(o));
  pane.loading = false;
}

// ---------- datafeed (one per pane) ----------
function feed(sub, t, p) {   // apply one live tick to the subscribed bar
  const ts = t - (t + offset) % sub.ms, b = sub.bar;   // align buckets to broker server time, like MT5 bars
  if (b && ts < b.timestamp) return;
  if (b && ts === b.timestamp) { b.high = Math.max(b.high, p); b.low = Math.min(b.low, p); b.close = p; b.volume++; }
  else sub.bar = { timestamp: ts, open: p, high: p, low: p, close: p, volume: 1 };   // volume = tick count
  sub.cb({ ...sub.bar });
}
const info = s => ({ ticker: s, name: s === 'US30' ? 'US30 (DIA ETF x100)' : s, shortName: s.replace(/(Roll)?\.PRO$/, ''), pricePrecision: digits[s] ?? 2, volumePrecision: 0 });

function makeDatafeed(pane) {
  const oldest = {};   // symbol+period -> timestamp of the oldest bar loaded
  let lastHist = null;
  const live = h => {   // (re)start the live bar from the last history bar, replaying ticks that arrived meanwhile
    const sub = pane.sub;
    if (!sub) return;
    sub.bar = h?.bar && { ...h.bar };
    for (const [t, p] of recent[sub.sym] || []) if (t > (h?.mark ?? 0)) feed(sub, t, p);
  };
  return {
    searchSymbols: async q => Object.keys(digits).filter(s => s.toLowerCase().includes((q || '').toLowerCase())).map(info),
    getHistoryKLineData: async (sym, period, _from, to) => {
      const key = sym.ticker + period.text, more = key in oldest && to <= oldest[key];   // scrolled left = load older
      if (!more && pane.sym !== sym.ticker) { pane.sym = sym.ticker; loadDrawings(pane); }
      const q = { s: sym.ticker, ms: periodMs(period), to: more ? to : null, n: 1000 };
      const load = (MT5 ? ask(q) : pubHistory(q.s, q.ms, q.to, q.n)).then(r => {
        const bars = r.bars.map(([timestamp, open, high, low, close, volume]) => ({ timestamp, open, high, low, close, volume }));
        if (bars.length) oldest[key] = bars[0].timestamp;
        if (!more) lastHist = { key, bar: bars.at(-1), mark: r.mark };
        return bars;
      });
      // Pro stops reacting to symbol/TF clicks made while this promise is pending (it skips reading its signals while loading),
      // so answer [] at once and put the bars on the chart ourselves when they land.
      load.then(bars => setTimeout(() => {   // after Pro has applied our [] and subscribed (it does that in microtasks)
        if (pane.pro.getSymbol().ticker !== sym.ticker || pane.pro.getPeriod().text !== period.text) return;   // user moved on
        if (more) return pane.kc.applyMoreData(bars, bars.length > 0);
        pane.kc.applyNewData(bars, bars.length > 0);
        live(lastHist);
      }));
      return [];
    },
    subscribe: (sym, period, cb) => {
      pane.sub = { sym: sym.ticker, ms: periodMs(period), cb, bar: null };
      live(lastHist?.key === sym.ticker + period.text ? lastHist : null);
    },
    unsubscribe: () => { pane.sub = null; },
  };
}

function openPane(el, symbol, period) {
  const pane = { el, ids: new Set() };
  panes.push(pane);
  pane.pro = new klinechartspro.KLineChartPro({
    container: el, theme: 'dark', locale: 'en-US', timezone: 'Asia/Bangkok', watermark: '',
    symbol: info(symbol), period, periods: PERIODS,
    mainIndicators: ['EMA'], subIndicators: MT5 ? ['VOL'] : [],   // index prices have no volume
    datafeed: makeDatafeed(pane),
  });
  el.addEventListener('mousedown', () => active = pane);
  el.addEventListener('mouseenter', () => active = pane);
  el.addEventListener('contextmenu', e => showMenu(e, pane));
  active ??= pane;
  return pane;
}

// ---------- reset view (Alt+R) + right-click menu ----------
function resetView(pane) {
  const kc = pane?.kc;
  if (!kc) return;
  kc.getDrawPaneById('candle_pane')?.getAxisComponent().setAutoCalcTickFlag(true);   // undo manual price-axis zoom
  kc.setBarSpace(8);                                                                  // klinecharts default bar width
  kc.scrollToRealTime();
  kc.adjustPaneViewport(false, true, true, true);
}

const menu = document.getElementById('menu');
function showMenu(e, pane) {
  e.preventDefault();
  active = pane;
  const main = pane.kc.getDom('candle_pane', 'main')?.getBoundingClientRect();
  const inCandle = main && e.clientY >= main.top && e.clientY <= main.bottom;
  const price = inCandle ? pane.kc.convertFromPixel([{ x: e.clientX - main.left, y: e.clientY - main.top }], { paneId: 'candle_pane' })[0]?.value : null;
  const txt = price != null ? price.toFixed(digits[pane.sym] ?? 2) : null;
  const items = [
    ['↺ ปรับมุมมองชาร์ตใหม่', 'Alt + R', () => resetView(pane)],
    txt && ['คัดลอกราคา ' + Number(txt).toLocaleString('en-US', { minimumFractionDigits: digits[pane.sym] ?? 2 }), '', () => navigator.clipboard.writeText(txt)],
    '-',
    ['ลบเส้นที่วาดทั้งหมด', '', () => { if (confirm(`ลบเส้นทั้งหมดของ ${info(pane.sym).shortName}?`)) [...pane.ids].forEach(id => pane.kc.removeOverlay(id)); }],
  ].filter(Boolean);
  menu.replaceChildren(...items.map(it => {
    if (it === '-') return document.createElement('hr');
    const d = document.createElement('div');
    d.innerHTML = `<span></span><kbd>${it[1]}</kbd>`;
    d.firstChild.textContent = it[0];
    d.onclick = () => { menu.hidden = true; it[2](); };
    return d;
  }));
  menu.hidden = false;
  menu.style.left = Math.min(e.clientX, innerWidth - menu.offsetWidth - 4) + 'px';
  menu.style.top = Math.min(e.clientY, innerHeight - menu.offsetHeight - 4) + 'px';
}
addEventListener('mousedown', e => { if (!menu.contains(e.target)) menu.hidden = true; });
addEventListener('keydown', e => {
  if (e.key === 'Escape') menu.hidden = true;
  if (e.altKey && e.code === 'KeyR') { e.preventDefault(); resetView(active); }
});

// ---------- toolbar ----------
const p1 = document.getElementById('p1'), btnCompare = document.getElementById('btnCompare'), btnKZ = document.getElementById('btnKZ');
btnCompare.onclick = () => {
  p1.hidden = !p1.hidden;
  btnCompare.classList.toggle('on', !p1.hidden);
  if (!p1.hidden && panes.length < 2) {
    const first = panes[0], other = Object.keys(digits).find(s => s !== first.sym) ?? first.sym;
    openPane(p1, other, first.pro.getPeriod());
  }
  dispatchEvent(new Event('resize'));   // Pro re-measures on window resize
};
document.getElementById('btnPlan').onclick = () => active?.kc.createOverlay({ name: 'tradePlan' });
btnKZ.onclick = () => {
  kzOn = !kzOn;
  btnKZ.classList.toggle('on', kzOn);
  for (const p of panes) kzOn ? p.kc.createIndicator('ICT_KZ', true, { id: 'candle_pane' }) : p.kc.removeIndicator('candle_pane', 'ICT_KZ');
};

// ---------- live data ----------
function onTicks(s, ticks) {
  const list = recent[s] ??= [], last = list.at(-1)?.[0] ?? 0;
  for (const [t, p] of ticks) {
    if (t <= last) continue;
    list.push([t, p]);
    for (const pane of panes) if (pane.sub?.sym === s) feed(pane.sub, t, p);
  }
  const keep = MT5 ? 120e3 : 6 * 36e5;   // online: ticks are the only source for second TFs, keep 6 hours
  while (list.length && list[0][0] < last - keep) list.shift();
}
const start = () => { if (!panes.length) openPane(document.getElementById('p0'), Object.keys(digits)[0], PERIODS[9]); };   // open on 1H, drill down from there

if (MT5) {
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.id) { waiting[m.id](m); delete waiting[m.id]; return; }
    if (m.hello) { digits = m.digits; offset = m.offset; drawings = m.drawings || {}; start(); return; }
    onTicks(m.s, m.ticks);
  };
  ws.onclose = () => { document.title = 'DISCONNECTED - restart server.py and refresh'; };
} else {
  digits = { US100: 1, US30: 1, XAUUSD: 2 };
  try { drawings = JSON.parse(localStorage.getItem('drawings')) || {}; } catch {}
  start();
  const okxSym = Object.fromEntries(Object.entries(OKX_IDS).map(([s, id]) => [id, s]));
  stream('wss://ws.okx.com:8443/ws/v5/public', { op: 'subscribe', args: Object.values(OKX_IDS).map(instId => ({ channel: 'index-tickers', instId })) },
    m => m.data && okxSym[m.arg?.instId] && onTicks(okxSym[m.arg.instId], m.data.map(d => [+d.ts, +d.idxPx])));
  stream('wss://ws.bitget.com/v2/ws/public', { op: 'subscribe', args: [{ instType: 'USDT-FUTURES', channel: 'ticker', instId: PUB.US30[0] }] },
    m => m.data && onTicks('US30', m.data.map(d => [+d.ts, d.indexPrice * PUB.US30[1]])));
}
</script>
