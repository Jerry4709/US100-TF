<script>
// ---------- ICT Sessions & Killzones (times are UTC, same as the TradingView indicator settings) ----------
const KZ = [
  { name: 'Asia',     from: '01:00', to: '08:00', color: '#ff9800', box: true },
  { name: 'Asia KZ',  from: '01:00', to: '05:00', color: '#ff9800' },
  { name: 'London',   from: '09:00', to: '14:30', color: '#00e676', box: true },
  { name: 'LOKZ',     from: '08:00', to: '11:00', color: '#00e676' },
  { name: 'LOCKZ',    from: '16:00', to: '18:00', color: '#00e676' },
  { name: 'New York', from: '14:30', to: '22:00', color: '#aa00ff', box: true },
  { name: 'NYKZ',     from: '13:00', to: '16:00', color: '#aa00ff' },
  { name: 'SYSNY',    from: '22:00', to: '02:00', color: '#00bcd4', box: true },
];
const KZ_MAX_TF_MIN = 45;   // hide killzones above this timeframe
const toMin = s => +s.slice(0, 2) * 60 + +s.slice(3);
KZ.forEach(z => { z.f = toMin(z.from); z.t = toMin(z.to); });
const inZone = (m, z) => z.f < z.t ? m >= z.f && m < z.t : m >= z.f || m < z.t;   // handles sessions crossing midnight

function kzCalc(list) {
  const res = list.map(() => ({}));
  res.zones = [];
  let tf = Infinity;
  for (let i = 1; i < Math.min(list.length, 50); i++) tf = Math.min(tf, list[i].timestamp - list[i - 1].timestamp);
  if (tf > KZ_MAX_TF_MIN * 6e4) return res;
  const open = {};
  list.forEach((k, i) => {
    const d = new Date(k.timestamp), m = d.getUTCHours() * 60 + d.getUTCMinutes();
    for (const z of KZ) {
      let c = open[z.name];
      if (!inZone(m, z)) { open[z.name] = null; continue; }
      if (!c || k.timestamp - c.lastTs > 6 * 36e5) {
        c = open[z.name] = { z, start: i, end: i, high: k.high, low: k.low, lastTs: k.timestamp };
        res.zones.push(c);
      } else { c.end = i; c.high = Math.max(c.high, k.high); c.low = Math.min(c.low, k.low); c.lastTs = k.timestamp; }
    }
  });
  // killzone high/low extend right until price trades through them (liquidity taken)
  for (const c of res.zones) {
    if (c.z.box) continue;
    c.hiEnd = c.loEnd = list.length - 1; c.hiHit = c.loHit = false;
    for (let j = c.end + 1; j < list.length && !(c.hiHit && c.loHit); j++) {
      if (!c.hiHit && list[j].high > c.high) { c.hiEnd = j; c.hiHit = true; }
      if (!c.loHit && list[j].low < c.low) { c.loEnd = j; c.loHit = true; }
    }
  }
  return res;
}

function kzDraw({ ctx, indicator, visibleRange, barSpace, xAxis, yAxis }) {
  const zones = indicator.result.zones || [], half = barSpace.bar / 2, fmt = v => v.toLocaleString('en-US', { maximumFractionDigits: 2 });
  const X = i => xAxis.convertToPixel(i), Y = v => yAxis.convertToPixel(v);
  ctx.font = '11px system-ui, sans-serif';
  for (const c of zones) {
    const last = c.z.box ? c.end : Math.max(c.hiEnd, c.loEnd);
    if (last < visibleRange.from - 1 || c.start > visibleRange.to + 1) continue;
    const x1 = X(c.start) - half, x2 = X(c.end) + half, yH = Y(c.high), yL = Y(c.low);
    ctx.strokeStyle = ctx.fillStyle = c.z.color;
    if (c.z.box) {
      ctx.globalAlpha = 0.18; ctx.fillRect(x1, yH, x2 - x1, yL - yH);
      ctx.globalAlpha = 1; ctx.fillText(c.z.name, x1, yH - 5);
      continue;
    }
    ctx.globalAlpha = 0.9; ctx.lineWidth = 1;
    for (const [y, end, hit, tag, v] of [[yH, c.hiEnd, c.hiHit, 'H', c.high], [yL, c.loEnd, c.loHit, 'L', c.low]]) {
      ctx.setLineDash([]); ctx.beginPath(); ctx.moveTo(x1, y); ctx.lineTo(x2, y); ctx.stroke();
      const xe = X(end);
      ctx.setLineDash([4, 3]); ctx.beginPath(); ctx.moveTo(x2, y); ctx.lineTo(xe, y); ctx.stroke();
      if (!hit) ctx.fillText(`${c.z.name} ${tag} ${fmt(v)}`, xe + 4, y + (tag === 'H' ? -3 : 11));   // label only untaken liquidity
    }
  }
  ctx.setLineDash([]); ctx.globalAlpha = 1;
  return true;
}
klinecharts.registerIndicator({ name: 'ICT_KZ', shortName: 'ICT KZ', series: 'price', zLevel: -1, figures: [], calc: kzCalc, draw: kzDraw });

// ---------- chart panes ----------
const UNIT = { second: 1e3, minute: 6e4, hour: 36e5, day: 864e5 };
const AXIS_FMT = { second: 'HH:mm:ss', minute: 'HH:mm', hour: 'MM-DD HH:mm', day: 'YYYY-MM-DD' };
const periodMs = p => p.multiplier * UNIT[p.timespan];
const PERIODS = [[5, 'second', '5s'], [10, 'second', '10s'], [15, 'second', '15s'], [30, 'second', '30s'],
  [1, 'minute', '1m'], [3, 'minute', '3m'], [5, 'minute', '5m'], [15, 'minute', '15m'], [30, 'minute', '30m'],
  [1, 'hour', '1H'], [4, 'hour', '4H'], [1, 'day', 'D']].map(([multiplier, timespan, text]) => ({ multiplier, timespan, text }));

const panes = [];    // { el, pro, kc, sym, sub, ids }
const recent = {};   // symbol -> last few minutes of live ticks [[utcMs, price], ...]
let digits = {}, offset = 0, drawings = {}, kzOn = true, active = null;

const ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host || 'localhost:8765'}/${location.search}`);   // keeps ?key= when online
const waiting = {};
let reqId = 0;
const ask = q => new Promise(res => { waiting[++reqId] = res; ws.send(JSON.stringify({ ...q, id: reqId })); });

// Pro hides its klinecharts instance; grab it at init to add seconds labels, drawing persistence and our indicator.
const kInit = klinecharts.init;
klinecharts.init = (dom, opts) => {
  const pane = panes.find(p => p.el.contains(dom));
  const kc = kInit(dom, { ...opts, customApi: {
    formatDate: (dtf, ts, _fmt, type) => klinecharts.utils.formatDate(dtf, ts,
      type === klinecharts.FormatDateType.XAxis ? AXIS_FMT[pane.pro?.getPeriod().timespan] ?? 'HH:mm' : 'YYYY-MM-DD HH:mm:ss')
  }});
  pane.kc = kc;
  hookDrawings(pane);
  if (kzOn) setTimeout(() => kc.createIndicator('ICT_KZ', true, { id: 'candle_pane' }));
  return kc;
};

// ---------- drawings: saved to the server (drawings.json) per symbol ----------
function hookDrawings(pane) {
  const { kc } = pane, create = kc.createOverlay.bind(kc), override = kc.overrideOverlay.bind(kc);
  let timer;
  const save = () => { if (!pane.loading) { clearTimeout(timer); timer = setTimeout(() => saveDrawings(pane), 300); } };
  const after = (fn, extra) => e => { const r = fn?.(e); extra?.(e); save(); return r; };
  kc.createOverlay = (value, paneId) => {
    const list = [].concat(value).map(o => typeof o === 'string' ? { name: o } : o).map(o => ({ ...o,
      onDrawEnd: after(o.onDrawEnd), onPressedMoveEnd: after(o.onPressedMoveEnd),
      onRemoved: after(o.onRemoved, e => pane.ids.delete(e.overlay.id)) }));
    const ids = create(list, paneId);
    ids.forEach(id => id && pane.ids.add(id));
    return Array.isArray(value) ? ids : ids[0];
  };
  kc.overrideOverlay = o => { override(o); save(); };
}

function saveDrawings(pane) {
  const list = [...pane.ids].map(id => pane.kc.getOverlayById(id)).filter(o => o && !o.isDrawing())
    .map(({ name, groupId, lock, visible, mode, styles, extendData, points }) =>
      ({ name, groupId, lock, visible, mode, styles, extendData, points: points.map(({ timestamp, value }) => ({ timestamp, value })) }));
  drawings[pane.sym] = list;
  ws.send(JSON.stringify({ op: 'save', s: pane.sym, overlays: list }));
  panes.filter(p => p !== pane && p.sym === pane.sym && p.kc).forEach(loadDrawings);   // same symbol open in the other pane
}

function loadDrawings(pane) {
  pane.loading = true;
  [...pane.ids].forEach(id => pane.kc.removeOverlay(id));
  pane.ids.clear();
  for (const o of drawings[pane.sym] || []) pane.kc.createOverlay(structuredClone(o));
  pane.loading = false;
}

// ---------- datafeed (one per pane) ----------
function feed(sub, t, p) {   // apply one live tick to the subscribed bar
  const ts = t - (t + offset) % sub.ms, b = sub.bar;   // align buckets to broker server time, like MT5 bars
  if (b && ts < b.timestamp) return;
  if (b && ts === b.timestamp) { b.high = Math.max(b.high, p); b.low = Math.min(b.low, p); b.close = p; b.volume++; }
  else sub.bar = { timestamp: ts, open: p, high: p, low: p, close: p, volume: 1 };   // volume = tick count
  sub.cb({ ...sub.bar });
}
const info = s => ({ ticker: s, name: s, shortName: s.replace(/Roll\.PRO$/, ''), pricePrecision: digits[s] ?? 2, volumePrecision: 0 });

function makeDatafeed(pane) {
  const oldest = {};   // symbol+period -> timestamp of the oldest bar loaded
  let lastHist = null;
  return {
    searchSymbols: async q => Object.keys(digits).filter(s => s.toLowerCase().includes((q || '').toLowerCase())).map(info),
    getHistoryKLineData: async (sym, period, _from, to) => {
      const key = sym.ticker + period.text, more = key in oldest && to <= oldest[key];   // scrolled left = load older
      const r = await ask({ s: sym.ticker, ms: periodMs(period), to: more ? to : null, n: 1000 });
      const bars = r.bars.map(([timestamp, open, high, low, close, volume]) => ({ timestamp, open, high, low, close, volume }));
      if (bars.length) oldest[key] = bars[0].timestamp;
      if (!more) {
        lastHist = { key, bar: bars.at(-1), mark: r.mark };
        if (pane.sym !== sym.ticker) { pane.sym = sym.ticker; loadDrawings(pane); }
      }
      return bars;
    },
    subscribe: (sym, period, cb) => {
      const h = lastHist?.key === sym.ticker + period.text ? lastHist : null;
      pane.sub = { sym: sym.ticker, ms: periodMs(period), cb, bar: h?.bar && { ...h.bar } };
      for (const [t, p] of recent[sym.ticker] || []) if (t > (h?.mark ?? 0)) feed(pane.sub, t, p);   // ticks that raced the history load
    },
    unsubscribe: () => { pane.sub = null; },
  };
}

function openPane(el, symbol, period) {
  const pane = { el, ids: new Set() };
  panes.push(pane);
  pane.pro = new klinechartspro.KLineChartPro({
    container: el, theme: 'dark', locale: 'en-US', timezone: 'Asia/Bangkok', watermark: '',
    symbol: info(symbol), period, periods: PERIODS,
    mainIndicators: ['EMA'], subIndicators: ['VOL'],
    datafeed: makeDatafeed(pane),
  });
  el.addEventListener('mousedown', () => active = pane);
  el.addEventListener('mouseenter', () => active = pane);
  el.addEventListener('contextmenu', e => showMenu(e, pane));
  active ??= pane;
  return pane;
}

// ---------- reset view (Alt+R) + right-click menu ----------
function resetView(pane) {
  const kc = pane?.kc;
  if (!kc) return;
  kc.getDrawPaneById('candle_pane')?.getAxisComponent().setAutoCalcTickFlag(true);   // undo manual price-axis zoom
  kc.setBarSpace(8);                                                                  // klinecharts default bar width
  kc.scrollToRealTime();
  kc.adjustPaneViewport(false, true, true, true);
}

const menu = document.getElementById('menu');
function showMenu(e, pane) {
  e.preventDefault();
  active = pane;
  const main = pane.kc.getDom('candle_pane', 'main')?.getBoundingClientRect();
  const inCandle = main && e.clientY >= main.top && e.clientY <= main.bottom;
  const price = inCandle ? pane.kc.convertFromPixel([{ x: e.clientX - main.left, y: e.clientY - main.top }], { paneId: 'candle_pane' })[0]?.value : null;
  const txt = price != null ? price.toFixed(digits[pane.sym] ?? 2) : null;
  const items = [
    ['↺ ปรับมุมมองชาร์ตใหม่', 'Alt + R', () => resetView(pane)],
    txt && ['คัดลอกราคา ' + Number(txt).toLocaleString('en-US', { minimumFractionDigits: digits[pane.sym] ?? 2 }), '', () => navigator.clipboard.writeText(txt)],
    '-',
    ['ลบเส้นที่วาดทั้งหมด', '', () => { if (confirm(`ลบเส้นทั้งหมดของ ${info(pane.sym).shortName}?`)) [...pane.ids].forEach(id => pane.kc.removeOverlay(id)); }],
  ].filter(Boolean);
  menu.replaceChildren(...items.map(it => {
    if (it === '-') return document.createElement('hr');
    const d = document.createElement('div');
    d.innerHTML = `<span></span><kbd>${it[1]}</kbd>`;
    d.firstChild.textContent = it[0];
    d.onclick = () => { menu.hidden = true; it[2](); };
    return d;
  }));
  menu.hidden = false;
  menu.style.left = Math.min(e.clientX, innerWidth - menu.offsetWidth - 4) + 'px';
  menu.style.top = Math.min(e.clientY, innerHeight - menu.offsetHeight - 4) + 'px';
}
addEventListener('mousedown', e => { if (!menu.contains(e.target)) menu.hidden = true; });
addEventListener('keydown', e => {
  if (e.key === 'Escape') menu.hidden = true;
  if (e.altKey && e.code === 'KeyR') { e.preventDefault(); resetView(active); }
});

// ---------- toolbar ----------
const p1 = document.getElementById('p1'), btnCompare = document.getElementById('btnCompare'), btnKZ = document.getElementById('btnKZ');
btnCompare.onclick = () => {
  p1.hidden = !p1.hidden;
  btnCompare.classList.toggle('on', !p1.hidden);
  if (!p1.hidden && panes.length < 2) {
    const first = panes[0], other = Object.keys(digits).find(s => s !== first.sym) ?? first.sym;
    openPane(p1, other, first.pro.getPeriod());
  }
  dispatchEvent(new Event('resize'));   // Pro re-measures on window resize
};
btnKZ.onclick = () => {
  kzOn = !kzOn;
  btnKZ.classList.toggle('on', kzOn);
  for (const p of panes) kzOn ? p.kc.createIndicator('ICT_KZ', true, { id: 'candle_pane' }) : p.kc.removeIndicator('candle_pane', 'ICT_KZ');
};

// ---------- live data ----------
ws.onmessage = e => {
  const m = JSON.parse(e.data);
  if (m.id) { waiting[m.id](m); delete waiting[m.id]; return; }
  if (m.hello) {
    digits = m.digits; offset = m.offset; drawings = m.drawings || {};
    if (!panes.length) openPane(document.getElementById('p0'), Object.keys(digits)[0], PERIODS[9]);   // open on 1H, drill down from there
    return;
  }
  const list = recent[m.s] ??= [], last = list.at(-1)?.[0] ?? 0;
  for (const [t, p] of m.ticks) {
    if (t <= last) continue;
    list.push([t, p]);
    for (const pane of panes) if (pane.sub?.sym === m.s) feed(pane.sub, t, p);
  }
  while (list.length && list[0][0] < last - 120e3) list.shift();   // keep ~2 minutes
};
ws.onclose = () => { document.title = 'DISCONNECTED - restart server.py and refresh'; };
</script>
</body>
